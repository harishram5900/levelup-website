<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LevelUp</title>
<style>
  html,body{margin:0;height:100%;background:#07070b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:calc(24px + env(safe-area-inset-top)) 28px calc(24px + env(safe-area-inset-bottom))}
  .logo{width:84px;height:84px;margin:0 auto 22px;border-radius:22px;background:linear-gradient(135deg,#2E7BFF,#0A45D6);display:grid;place-items:center;box-shadow:0 20px 50px -18px #2E7BFF}
  h1{font-size:26px;margin:0 0 10px;letter-spacing:-.02em} p{color:#a3a3b2;line-height:1.5;margin:0 auto 26px;max-width:300px}
  button{background:#FE8500;color:#1a1100;border:0;border-radius:999px;padding:15px 30px;font-size:16px;font-weight:800;box-shadow:0 6px 0 #b35d00}
  button:active{transform:translateY(3px);box-shadow:0 3px 0 #b35d00}
</style></head>
<body><main><div>
  <div class="logo"><svg width="46" height="46" viewBox="0 0 40 40"><path d="M10 9h6v16h14v6H10z" fill="#fff"/><path d="M22 9h8v8h-8z" fill="#fff"/></svg></div>
  <h1>You're offline</h1>
  <p>Your co-founders need the internet to think. Check your connection and we'll pick up right where you left off.</p>
  <button type="button" onclick="retry()">Try again</button>
</div></main>
<script>
  function retry(){ location.href = "https://www.levelupinnovations.tech/app?source=app"; }
  window.addEventListener("online", retry);
</script>
</body></html>
